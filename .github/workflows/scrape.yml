name: Scrape Homes Tokyo Stores

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix data directory
        run: |
          if [ -e data ]; then
            rm -rf data
          fi
          mkdir -p data

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas playwright
          playwright install --with-deps

      - name: Run scraper
        run: |
          python scraper.py

      - name: Upload HTML artifact
        uses: actions/upload-artifact@v3
        with:
          name: page-html
          path: page.html

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/stores.csv data/diff.csv || echo "No files to add"
          git commit -m "Update store list" || echo "No changes"
          git push || echo "No push"
